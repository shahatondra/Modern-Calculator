<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f1eeee;
        }

        .calculator {
            width: 400px;
            height: 650px;
            background-color: #4b4c4df6;
            padding: 20px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
        }

        #display {
            width: 100%;
            height: 150px;
            background-color: #f0f3f3fd;
            color: #080808;
            outline: auto;
            padding: 15px;
            font-size: 2.5rem; 
            border-radius: 8px;
            margin-bottom: 20px;
            word-wrap: break-word;
            word-break: break-all;
            overflow-y: auto;
            display: flex;
            align-items: flex-end; 
            justify-content: flex-end;
            text-align: right;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            flex-grow: 1;
        }

        button {
            padding: 14px;
            font-size: 1.25rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #080808;
            color: #e4e1e1;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #7a8088;
        }

        button.operator {
            background-color: #fa3979;
            color: #080808;
            font-size: 25px;
        }

        button.operator:hover {
            background-color: #a7a4a3;
        }

        button.clear {
            background-color: #e40909;
        }

        button.clear:hover {
            background-color: #f1a2a2;
        }

        button.equal {
            grid-column: span 3;
            background-color: #242423;
            color: #faf8f8;
        }

        button.equal:hover {
            background-color: #8a8b8b;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <h2 style="color: rgb(245, 243, 243);text-align: center;margin-bottom: 5px;">Calculator</h2>
        <div id="display"></div>

        <div class="buttons">
            <button onclick="appendValue('+')" class="operator">+</button>
            <button onclick="appendValue('/')" class="operator">/</button>
            <button onclick="appendValue('*')" class="operator">*</button>
            <button onclick="appendValue('-')" class="operator">-</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="clear" onclick="clearDisplay()">AC</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>

            <button onclick="appendValue('.')">.</button>
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('^')">^</button>
            
            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('(')">(</button>
            <button onclick="appendValue(')')">)</button>
            <button onclick="appendValue('%')">%</button>
            <button onclick="appendValue('00')">00</button>
            <button onclick="calculate()" class="equal">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');

        function adjustFontSize() {
            const length = display.innerText.length;
            if (length > 30) {
                display.style.fontSize = '1.2rem'; 
            } else if (length > 12) {
                display.style.fontSize = '1.8rem'; 
            } else {
                display.style.fontSize = '2.5rem'; 
            }
        }

        function appendValue(input) {
            if (display.innerText.length < 100) {
                display.innerText += input;
                adjustFontSize();
            }
        }

        function clearDisplay() {
            display.innerText = '';
            adjustFontSize();
        }

        function calculate() {
            try {
                let expression = display.innerText;
                
                expression = expression.replace(/\^/g, '**');

                let result = eval(expression);
                
                display.innerText = result;
            } catch (error) {
                display.innerText = "Error";
            }
            adjustFontSize();
        }
    </script>

</body>
</html>
